name: OCI Pilot - Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/feature/oci-deployment'
    runs-on: ubuntu-latest
    environment: oci-pilot
    timeout-minutes: 15
    steps:
      - name: Install OCI CLI
        run: pipx install oci-cli
      - name: Read-only OCI checks
        shell: bash
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          set -euo pipefail
          umask 077
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$work/key.pem"
          openssl pkey -in "$work/key.pem" -noout
          printf '[DEFAULT]\nuser=%s\ntenancy=%s\nfingerprint=%s\nregion=%s\nkey_file=%s\n' "$OCI_USER" "$OCI_TENANCY" "$OCI_FINGERPRINT" "$OCI_REGION" "$work/key.pem" > "$work/config"
          unset OCI_PRIVATE_KEY
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          oci_cmd() { oci --config-file "$work/config" "$@"; }
          echo "Checking subscribed regions..."
          oci_cmd iam region-subscription list --query 'data[].{"region":"region-name","home":"is-home-region","status":status}'
          echo "Checking availability domains..."
          oci_cmd iam availability-domain list --compartment-id "$OCI_TENANCY" --query 'data[].name'
          echo "Checking compartment visibility..."
          oci_cmd iam compartment list --compartment-id "$OCI_TENANCY" --all --query 'length(data)'
          echo "Checking compute service limits..."
          oci_cmd limits value list --compartment-id "$OCI_TENANCY" --service-name compute --all --query 'data[?contains(name, `a1`)].{name:name,value:value,scope:"scope-type"}'
          echo "Read-only checks completed. Limits do not guarantee host capacity or write permissions."
