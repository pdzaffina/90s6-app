name: OCI Pilot - State and Provision
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (bootstrap creates only state bucket)
        type: choice
        options: [bootstrap, plan, apply]
        default: plan
      confirmation:
        description: Enter CREATE-PILOT to authorize apply
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: oci-pilot-state
  cancel-in-progress: false
jobs:
  manage:
    if: github.ref == 'refs/heads/feature/oci-deployment'
    runs-on: ubuntu-latest
    environment: oci-pilot
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Install OCI CLI
        run: pipx install oci-cli
      - name: Manage private state and infrastructure
        working-directory: infrastructure/oci
        shell: bash
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_region: ${{ vars.OCI_REGION }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: bash state-workflow.sh
