name: Sentinel tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sentinel-worker*'
      - 'scripts/sentinel-retry.test.mjs'
      - 'supabase/functions/sentinel-worker/**'
      - 'supabase/migrations/*sentinel*'
      - 'news-watch/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/sentinel-*.test.mjs
      - run: node --check news-watch/news-watch.js
