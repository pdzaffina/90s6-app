<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization administration | 90S6</title><link rel="stylesheet" href="/shared/app.css"></head><body class="ap-body"><main class="ap-main"><h1>Organization administration</h1><p id="tenantAdminStatus" role="status">Loading...</p><section class="ap-panel" id="tenantAdminPanel" hidden><h2>Members</h2><p>Assign an existing 90S6 account to this organization. Global administrator status cannot be changed here.</p><table class="ap-table"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody id="tenantAdminRows"></tbody></table><h3>Add or update a member</h3><form id="tenantMemberForm" class="ap-row"><select id="tenantMemberUser" class="ap-input" required></select><select id="tenantMemberRole" class="ap-input"><option value="user">User</option><option value="superuser">Superuser</option><option value="tenant_admin">Tenant Admin</option></select><select id="tenantMemberStatus" class="ap-input"><option value="active">Active</option><option value="inactive">Inactive</option></select><button type="submit" class="ap-btn primary">Save membership</button></form></section><section class="ap-panel" id="globalTenantPanel" hidden><h2>Create organization</h2><form id="tenantCreateForm" class="ap-row"><input class="ap-input" id="tenantName" placeholder="Organization name" required><input class="ap-input" id="tenantSlug" placeholder="organization-slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required><button class="ap-btn primary" type="submit">Create</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/shared/config.js"></script><script src="/shared/app.js"></script><script src="/tenant-admin/tenant-admin.js"></script></body></html>
