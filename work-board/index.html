<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js; connect-src https://ohsrtfnlnlbipylyqpnh.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Board</title>
<style>
:root{--paper:#faf8f0;--ink:#242a30;--muted:#66717c;--line:#d5dce0;--blue:#226b9c;--green:#327c60;--amber:#94601e;--shadow:0 10px 34px #26344116;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:#e9edef;color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #83bce8;outline-offset:2px}
header{max-width:1440px;margin:auto;padding:28px 26px 16px;display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-family:Georgia,serif;font-size:clamp(30px,4vw,44px);letter-spacing:-1px}header p{margin:3px 0 0;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.fileLabel{border:1px solid #c9d1d8;border-radius:9px;background:#fff;color:var(--ink);padding:9px 13px;font-weight:600}.primary{background:#253b4a;color:white;border-color:#253b4a}.ghost{background:transparent}.danger{color:#a43131}.fileLabel{cursor:pointer}.fileLabel input{display:none}
.filters{max-width:1440px;margin:0 auto;padding:0 26px 17px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.filters label{font-size:13px;font-weight:700;color:#52606b}.filters select,.filters input{margin-left:6px;padding:8px 10px;border:1px solid #c6d0d8;border-radius:8px;background:#fff;min-height:38px}.filters input{width:min(280px,70vw)}.filter-status{font-size:13px;color:var(--muted);margin-left:auto}
main{max-width:1440px;margin:0 auto;padding:0 26px 30px}.board{background:var(--paper);border-radius:17px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:hidden;border:1px solid #e5e1d4;overscroll-behavior-x:contain;scrollbar-gutter:stable}.board-grid{display:grid;grid-template-columns:155px repeat(var(--cols,3),minmax(240px,1fr));min-width:calc(155px + var(--cols,3)*240px)}.corner,.colhead,.rowhead,.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.lastcol{border-right:0}.corner{padding:20px 10px;background:#f2f0e8}.corner small{display:block;color:var(--muted);text-transform:uppercase;font-weight:700;font-size:10px;letter-spacing:1px}.corner strong{font-family:Georgia,serif;font-size:19px}.colhead{text-align:center;padding:17px 8px 14px;background:#f8f6ec}.colhead h2{font-family:Georgia,serif;font-size:clamp(22px,3vw,31px);font-weight:500;margin:0}.colhead p{font-size:12px;color:var(--muted);margin:0}.rowhead{padding:24px 16px;background:#f5f2e9;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px}.rowhead .row-title{font:italic 23px/1.2 Georgia,serif}.rowhead p{margin:0;color:var(--muted);font-size:12px}.cell{min-height:290px;padding:11px;display:flex;flex-direction:column;gap:10px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 40px,#e7e6df 41px,transparent 42px);transition:background .15s}.cell.drag-over{background:#dceefa;outline:3px dashed #227aaa;outline-offset:-5px}.cell.empty .empty-hint{display:block}.empty-hint{display:none;text-align:center;color:#9ca5a7;margin:auto;font-size:12px;max-width:160px}.add-inline{border:1px dashed #b8c5c9;background:#ffffffb8;color:#576771;border-radius:8px;padding:7px;font-size:12px;font-weight:600;align-self:stretch;margin-top:auto}.chunk{position:relative;background:white;border-radius:10px;border:1px solid #d6dfe4;border-left:5px solid var(--blue);box-shadow:0 2px 7px #20303c12;padding:10px 11px;cursor:grab}.chunk:active{cursor:grabbing}.chunk[data-role="BSA"]{border-left-color:var(--green)}.chunk[data-role="Engineer"]{border-left-color:var(--amber)}.chunk.is-dragging{opacity:.45}.chunk .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:4px}.pill{font-size:10px;font-weight:800;letter-spacing:.3px;border-radius:5px;padding:2px 6px;background:#edf3f7;color:#31526c}.chunk[data-role="BSA"] .pill{background:#e5f3eb;color:#2b7350}.chunk[data-role="Engineer"] .pill{background:#fff0d7;color:#8e5714}.effort{background:#f1f0ed;color:#6c7174}.chunk h3{font-size:14px;line-height:1.3;margin:3px 0;font-weight:750;overflow-wrap:anywhere}.chunk p{font-size:12px;color:#65717a;margin:4px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}.chunk footer{display:flex;align-items:center;justify-content:space-between;gap:6px;color:#71808c;font-size:11px}.chunk .edit{background:none;border:0;padding:2px 5px;color:#365e7c;font-size:12px}.legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px;color:#56636d;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--blue)}.dot.bsa{background:var(--green)}.dot.eng{background:var(--amber)}.legend .tip{margin-left:auto}.notice{margin-top:7px;font-size:12px;color:#687884}
dialog{border:1px solid #d0d9de;border-radius:16px;padding:0;width:min(540px,calc(100vw - 28px));box-shadow:0 30px 90px #17232b55}dialog::backdrop{background:#1727358c}.modal-head{padding:20px 23px 0}.modal-head h2{font:28px Georgia,serif;margin:0}.modal-head p{margin:3px 0;color:#647380;font-size:13px}form{padding:16px 23px 22px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}.field label{font-size:12px;font-weight:800;color:#3d4d59}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #c7d2d9;border-radius:8px;background:#fff}.field textarea{resize:vertical;min-height:76px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;justify-content:flex-end;align-items:center;margin-top:18px}.actions .danger{margin-right:auto}.status{position:fixed;bottom:20px;right:20px;background:#273f4b;color:white;padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;z-index:10}
@media(max-width:900px){.board-grid{grid-template-columns:104px repeat(var(--cols,3),minmax(190px,1fr));min-width:calc(104px + var(--cols,3)*190px)}.board{overflow-x:auto}.rowhead{padding:13px}.rowhead .row-title{font-size:19px}.cell{padding:8px;min-height:320px}.filters{gap:8px}.filter-status{margin-left:0}}@media(max-width:560px){header,main,.filters{padding-left:12px;padding-right:12px}header{padding-top:18px}.toolbar button,.fileLabel{padding:7px 9px;font-size:12px}.board-grid{grid-template-columns:90px repeat(var(--cols,3),minmax(185px,1fr));min-width:calc(104px + var(--cols,3)*185px)}.corner strong{font-size:14px}.rowhead .row-title{font-size:17px}.legend .tip{margin-left:0}.field-row{grid-template-columns:1fr}}
@media print{body{background:white}header{padding:5px 0}.toolbar,.filters,.add-inline,.chunk .edit,.legend .tip,.notice{display:none!important}main{padding:0}.board{box-shadow:none}.board{overflow:visible;scrollbar-gutter:auto}.board-grid{grid-template-columns:100px repeat(var(--cols,3),minmax(0,1fr));min-width:0}.cell{min-height:300px}.chunk{break-inside:avoid}}
</style>
<style>
/* flat look: no ruled lines or serif fonts, same colors */
h1,.corner strong,.colhead h2{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-style:normal}
h1{font-weight:700;letter-spacing:-.5px}.colhead h2{font-weight:650}
.rowhead .row-title{font:700 17px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
.modal-head h2{font:700 24px system-ui,-apple-system,"Segoe UI",sans-serif}
.cell{background:none}
/* view switch */
.viewSwitch{display:flex}.viewSwitch button{border-radius:0}.viewSwitch button:first-child{border-radius:9px 0 0 9px}.viewSwitch button:last-child{border-radius:0 9px 9px 0;border-left:0}
body.view-wbs .board,body.view-wbs .legend,body.view-wbs #boardFilters{display:none}body:not(.view-wbs) .wbsWrap{display:none}
#boardFilters{max-width:1440px;margin:0 auto 12px;padding:10px 26px;display:flex;align-items:end;gap:10px;flex-wrap:wrap}#boardFilters label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:#52606b}#boardFilters select,#boardFilters input{min-width:125px;max-width:210px;border:1px solid #c6d0d8;border-radius:7px;background:#fff;padding:7px 9px;font-size:13px}#boardFilters button{padding:7px 11px;font-size:12px}@media(max-width:560px){#boardFilters{padding-left:12px;padding-right:12px}}
/* WBS table */
.wbsWrap{background:#fff;border:1px solid #d6dfe4;border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
.wbsFilters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;padding:10px 12px 14px;border-top:1px solid #e8edf0}.wbsFilters label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:#52606b}.wbsFilters select,.wbsFilters input{min-width:125px;max-width:210px;border:1px solid #c6d0d8;border-radius:7px;background:#fff;padding:7px 9px;font-size:13px}.wbsFilters button{padding:7px 11px;font-size:12px}.wbsTop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;flex-wrap:wrap}
.wbsWrap table{width:100%;border-collapse:collapse;min-width:860px;font-size:13px}
.wbsWrap th{text-align:left;padding:10px 12px;background:#f2f0e8;color:#52606b;font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.wbsWrap td{padding:7px 12px;border-bottom:1px solid #e8edf0;vertical-align:middle}
.wbsWrap tbody tr:hover td{background:#faf8f0}



.wbsNum{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.wbsTask{display:flex;align-items:center;gap:6px;font-weight:650}
.wbsTask .tg{display:inline-block;width:22px;border:0;background:none;padding:0;color:#52606b;text-align:center}
.wbsAct{display:flex;gap:6px;white-space:nowrap}.wbsAct button{padding:4px 9px;font-size:12px}
/* nesting + attachments on cards */
.crumb{font-size:11px;color:var(--muted);margin-bottom:2px}
.atts{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}.atts:empty{display:none}
.att{padding:2px 7px;font-size:11px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#f1f4f6;border-color:#d6dfe4;color:#365e7c}
body.readonly .wbs-edit{display:none!important}
.wbsWrap td input,.wbsWrap td select{width:100%;min-width:100px;max-width:230px;border:1px solid #b7c9d6;border-radius:6px;background:#fff;padding:6px 8px;font-size:13px}.wbsTask input{min-width:210px;flex:1}.wbsWrap td:has(input),.wbsWrap td:has(select){padding:4px 6px}.wbsWrap td input:focus,.wbsWrap td select:focus{outline:2px solid #83bce8}
</style>

<body>
<header><div><h1>Work Board</h1><p>A simple way to decide what matters now, next, and later.</p></div><div class="toolbar"><button id="newBtn" class="primary">+ Add work item</button><button id="exportBtn">Export JSON</button><label class="fileLabel">Import JSON<input type="file" id="importInput" accept="application/json,.json"></label><button id="resetBtn" class="ghost">Reset</button></div></header>
<div class="filters"><div class="viewSwitch"><button type="button" id="viewBoard" class="primary">Board</button><button type="button" id="viewWbs">WBS</button></div><button type="button" id="exportWbsBtn" hidden>Export WBS to Excel</button><label>Search <input id="searchInput" placeholder="Find a work item..."></label><span class="filter-status" id="countStatus" aria-live="polite"></span></div>
<div id="boardFilters" aria-label="Board filters"></div><main><section id="wbs" class="wbsWrap" aria-label="Work breakdown structure"></section><div class="board" aria-label="Work prioritization board"><div class="board-grid" id="board"></div></div><div class="legend"><span class="tip">Drag items to reprioritize · Click Edit to update · Saved automatically</span></div><p class="notice">Your board changes are saved automatically. Export JSON anytime to keep a backup.</p></main>
<dialog id="editor"><div class="modal-head"><h2 id="modalTitle">Add work item</h2><p>Make each item small enough to produce a clear outcome.</p></div><form id="chunkForm"><input type="hidden" id="chunkId"><div class="field"><label for="title">Work item *</label><input id="title" required maxlength="140" placeholder="e.g. Map approval workflow"></div><div class="field"><label for="description">Outcome / next deliverable</label><textarea id="description" maxlength="600" placeholder="What will be true when this work item is complete?"></textarea></div><div class="field"><label for="owner_id">Owner (organization member)</label><select id="owner_id"><option value="">Unassigned</option></select><input type="hidden" id="owner"><label for="poc">Point of contact (optional)</label><input id="poc" maxlength="80" placeholder="Secondary or external contact"></div><div class="field-row"><div class="field"><label for="when">Column</label><select id="when"></select></div><div class="field"><label for="kind">Swimlane</label><select id="kind"></select></div></div><div class="field-row"><div class="field"><label for="itemStatus">Status</label><select id="itemStatus"><option>To Do</option><option>In Progress</option><option>Done</option></select></div><div class="field"><label for="effort">Size</label><select id="effort"><option>Small</option><option selected>Medium</option><option>Large</option></select></div><div class="field"><label for="due">Due date (optional)</label><input type="date" id="due"></div></div><div class="field"><label for="parent">Parent task (optional)</label><select id="parent"></select></div><div class="actions"><button type="button" class="danger" id="deleteBtn" hidden>Delete</button><button type="button" id="cancelBtn">Cancel</button><button class="primary" type="submit">Save work item</button></div></form></dialog><div id="toast" class="status" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
